name: AI Security Scan

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pydantic python-dotenv

      - name: Run AI Security Scanner
        id: scan
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scanner.py --dir .

      # 1. Save a downloadable history of every report
      - name: Upload Security Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-run-${{ github.run_number }}
          path: security-reports/security_report.md
          retention-days: 90

      # 2. Create or update a single PR comment
      - name: Create or Update PR Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'security-reports/security_report.md';

            if (!fs.existsSync(reportPath)) {
              core.warning('Security report file not found.');
              return;
            }

            const reportContent = fs.readFileSync(reportPath, 'utf8');
            const marker = '<!-- ai-security-scanner-report -->';
            const body = `${marker}\n${reportContent}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Search existing comments for the hidden marker
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const existingComment = comments.find(comment =>
              comment.body && comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
              core.info(`Updated existing PR comment #${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info('Created new PR comment.');
            }

      # 3. Enforce the security gate after uploading the artifact and updating the PR
      - name: Check Security Gate Result
        if: steps.scan.outcome == 'failure'
        run: |
          echo "Security gate failed. Check the PR comment or downloaded report artifact for details."
          exit 1